name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
  schedule:
    - cron: "53 2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schedule-guard:
    name: Scheduled change guard
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check for commits since the previous scheduled run
        id: check
        shell: bash
        env:
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ApiUrl="https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/runs?event=schedule&status=completed&branch=${DEFAULT_BRANCH}&per_page=1"
          if ! Response="$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$ApiUrl")"; then
            echo "::warning::Could not query the previous scheduled CI run; running validation."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PreviousSha="$(python3 -c 'import json, sys; runs = json.load(sys.stdin)["workflow_runs"]; print(runs[0]["head_sha"] if runs else "")' <<< "$Response")"
          if [[ -n "$PreviousSha" && "$PreviousSha" == "$CURRENT_SHA" ]]; then
            echo "No commits since the previous scheduled CI run."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Scheduled CI will validate ${CURRENT_SHA}."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs:
      - schedule-guard
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.should-run == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC 2022 Development
            runner: windows-2022
            platform: windows
            compiler: msvc
            configuration: Development
            visual_studio_version: 2022
            premake_action: vs2022
            solution: ProjectTemplate.sln
          - name: Windows MSVC 2026 Shipping
            runner: windows-2025-vs2026
            platform: windows
            compiler: msvc
            configuration: Shipping
            visual_studio_version: 2026
            premake_action: vs2026
            solution: ProjectTemplate.slnx
          - name: Linux GCC Development
            runner: ubuntu-24.04
            platform: linux
            compiler: gcc
            configuration: Development
            cc: gcc-14
            cxx: g++-14
            cxxflags: ""
            ldflags: ""
          - name: Linux Clang Shipping
            runner: ubuntu-24.04
            platform: linux
            compiler: clang
            configuration: Shipping
            cc: clang-19
            cxx: clang++-19
            cxxflags: -stdlib=libc++
            ldflags: -stdlib=libc++

    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Restore project-local tools
        id: bootstrap-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: External/Premake
          key: ${{ runner.os }}-project-template-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Setup.*', 'Scripts/DependencyLock.*') }}

      - name: Install Linux window-system packages
        if: matrix.platform == 'linux'
        shell: bash
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          gcc-14
          g++-14
          clang-19
          libc++-dev
          libc++abi-dev
          libgl1-mesa-dev
          libx11-dev
          libxrandr-dev
          libxinerama-dev
          libxcursor-dev
          libxi-dev
          libxkbcommon-dev
          libwayland-dev
          wayland-protocols
          weston
          xvfb

      - name: Test dependency lock parser on Windows
        if: matrix.platform == 'windows'
        shell: powershell
        run: .\Scripts\Tests\DependencyLock.Tests.ps1

      - name: Test dependency lock parser on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: bash ./Scripts/Tests/DependencyLock.Tests.sh

      - name: Set up project on Windows
        if: matrix.platform == 'windows'
        shell: cmd
        run: Setup.bat -VisualStudioVersion ${{ matrix.visual_studio_version }}

      - name: Generate Visual Studio projects
        if: matrix.platform == 'windows'
        shell: cmd
        run: GenerateProjectFiles.bat ${{ matrix.premake_action }}

      - name: Build project on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $MSBuildPath = & .\Scripts\Setup.ps1 `
            -PrintMSBuildPath `
            -VisualStudioVersion ${{ matrix.visual_studio_version }}
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($MSBuildPath)) {
            throw 'Could not resolve MSBuild for the selected Visual Studio toolchain.'
          }

          & $MSBuildPath `
            '${{ matrix.solution }}' `
            /m `
            /t:StarterApp,StarterTests `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $TestResults = 'TestResults/${{ matrix.platform }}-${{ matrix.compiler }}-${{ matrix.configuration }}.xml'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $TestResults) | Out-Null
          & .\Binaries\Windows\x86_64\${{ matrix.configuration }}\StarterTests.exe --duration=true
          $ConsoleExitCode = $LASTEXITCODE
          & .\Binaries\Windows\x86_64\${{ matrix.configuration }}\StarterTests.exe --reporters=junit --out=$TestResults
          if ($ConsoleExitCode -ne 0) {
            exit $ConsoleExitCode
          }
          exit $LASTEXITCODE

      - name: Set up project on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: bash ./Setup.sh

      - name: Generate GNU Make projects
        if: matrix.platform == 'linux'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: bash ./GenerateProjectFiles.sh

      - name: Build project on Linux
        if: matrix.platform == 'linux'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          LDFLAGS: ${{ matrix.ldflags }}
        run: |
          Configuration="${{ matrix.configuration }}"
          make --directory=Intermediate/ProjectFiles/gmake \
            --jobs=2 \
            config="${Configuration,,}" \
            CC="${CC}" \
            CXX="${CXX}" \
            CXXFLAGS="${CXXFLAGS}" \
            LDFLAGS="${LDFLAGS}"

      - name: Run tests on Linux
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 3
        run: |
          set +e
          TestResults="TestResults/${{ matrix.platform }}-${{ matrix.compiler }}-${{ matrix.configuration }}.xml"
          mkdir -p -- "$(dirname -- "$TestResults")"
          ./Binaries/Linux/x86_64/${{ matrix.configuration }}/StarterTests --duration=true
          ConsoleExitCode=$?
          ./Binaries/Linux/x86_64/${{ matrix.configuration }}/StarterTests --reporters=junit --out="$TestResults"
          JunitExitCode=$?
          if [[ $ConsoleExitCode -ne 0 ]]; then
            exit "$ConsoleExitCode"
          fi
          exit "$JunitExitCode"

      - name: Run X11 application smoke test on Linux
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 2
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 \
            ./Binaries/Linux/x86_64/${{ matrix.configuration }}/StarterApp \
            --smoke-test --platform=x11

      - name: Run Wayland application smoke test on Linux
        if: matrix.platform == 'linux'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          RuntimeDirectory="$(mktemp -d)"
          chmod 700 "$RuntimeDirectory"
          export XDG_RUNTIME_DIR="$RuntimeDirectory"

          weston \
            --backend=headless-backend.so \
            --socket=wayland-ci \
            --idle-time=0 \
            --log="$RuntimeDirectory/weston.log" &
          WestonPid=$!
          trap 'kill "$WestonPid" 2>/dev/null || true; rm -rf -- "$RuntimeDirectory"' EXIT

          for Attempt in {1..50}; do
            if [[ -S "$RuntimeDirectory/wayland-ci" ]]; then break; fi
            if ! kill -0 "$WestonPid" 2>/dev/null; then
              cat "$RuntimeDirectory/weston.log"
              exit 1
            fi
            sleep 0.1
          done

          test -S "$RuntimeDirectory/wayland-ci" || {
            cat "$RuntimeDirectory/weston.log"
            exit 1
          }
          DISPLAY= WAYLAND_DISPLAY=wayland-ci LIBGL_ALWAYS_SOFTWARE=1 \
            ./Binaries/Linux/x86_64/${{ matrix.configuration }}/StarterApp \
            --smoke-test --platform=wayland

      - name: Save project-local tools
        if: github.event_name != 'pull_request' && steps.bootstrap-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: External/Premake
          key: ${{ runner.os }}-project-template-bootstrap-v2-${{ hashFiles('Config/Dependencies.lock', 'Scripts/Setup.*', 'Scripts/DependencyLock.*') }}

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.platform }}-${{ matrix.compiler }}-${{ matrix.configuration }}-${{ github.sha }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: required
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.should-run == 'true') }}
    needs:
      - schedule-guard
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every build
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
